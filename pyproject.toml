[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "django-pyui"
version = "0.1.0"
description = "Build Django page interfaces with composable Python components."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Django>=5.2,<6.0"]

[tool.setuptools.packages.find]
include = ["django_pyui*"]

[tool.setuptools.package-data]
django_pyui = ["static/django_pyui/*.css", "static/django_pyui/*.js", "templates/django_pyui/*.html"]
